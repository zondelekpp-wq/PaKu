    function updateScheduleSettings() {
      const rec = activeRec();
      rec.freqDays = parseInt(document.getElementById('freqDays').value, 10) || 1;
      rec.unlockTime = document.getElementById('unlockTime').value || '08:00';
      const dv = document.getElementById('startDate').value;
      if (dv) {
        const today = localDateStr(new Date(nowMs()));
        if (dv === today) {
          // start dziś: pierwszy rozdział otwarty od razu
          const startedToday = localDateStr(new Date(rec.startDateISO)) === today && new Date(rec.startDateISO).getTime() <= nowMs();
          if (!startedToday) rec.startDateISO = new Date(nowMs()).toISOString();
        } else {
          const [y, m, d] = dv.split('-').map(Number);
          const [hh, mm] = rec.unlockTime.split(':').map(Number);
          rec.startDateISO = new Date(y, m - 1, d, hh || 0, mm || 0, 0, 0).toISOString();
        }
      }
      saveState();
      renderLibrary();
      renderReader();
    }

    function splitTextIntoChapters(rawText) {
      const cleaned = rawText.replace(/\r\n/g, '\n').trim();
      const regex = /(?:^|\n)(?=(?:Rozdział|ROZDZIAŁ|Część|CZĘŚĆ|Chapter|CHAPTER|Part|PART|Kapitel|KAPITEL|Teil|TEIL|Capítulo|CAPÍTULO|Capitulo|CAPITULO|Parte|PARTE|Розділ|РОЗДІЛ|Глава|ГЛАВА|Частина|ЧАСТИНА)\s+[0-9IVXLCDM]+[^\n]{0,70}(?:\n|$))/g;
      const parts = cleaned.split(regex).map(s => s.trim()).filter(Boolean);
      if (parts.length >= 2) {
        // tekst przed pierwszym nagłówkiem (strona tytułowa, spis treści): krótki dokładamy do rozdziału 1
        const headRe = /^(?:Rozdział|ROZDZIAŁ|Część|CZĘŚĆ|Chapter|CHAPTER|Part|PART|Kapitel|KAPITEL|Teil|TEIL|Capítulo|CAPÍTULO|Capitulo|CAPITULO|Parte|PARTE|Розділ|РОЗДІЛ|Глава|ГЛАВА|Частина|ЧАСТИНА)\s+[0-9IVXLCDM]+/;
        if (!headRe.test(parts[0]) && parts.length >= 3 && parts[0].length < 250) {
          const pre = parts.shift();
          parts[0] = parts[0].includes('\n') ? parts[0].replace('\n', '\n' + pre + '\n') : parts[0] + '\n' + pre;
        }
        return parts.map((p, idx) => {
          const lines = p.split('\n');
          const title = lines[0].slice(0, 80);
          const content = lines.slice(1).join('\n').trim() || p;
          return { title: title || t('chapterN', { n: idx + 1 }), content };
        });
      }
      // Brak nagłówków rozdziałów: dzielimy po ~1200 słów, ale na granicy akapitów
      const chunkSize = 1200;
      const units = [];
      for (const p of cleaned.split(/\n+/)) {
        const w = p.split(/\s+/).filter(Boolean);
        if (!w.length) continue;
        if (w.length <= chunkSize) units.push({ text: p.trim(), n: w.length });
        else for (let i = 0; i < w.length; i += chunkSize) {
          const c = w.slice(i, i + chunkSize);
          units.push({ text: c.join(' '), n: c.length });
        }
      }
      const chapters = [];
      let cur = [], cnt = 0;
      const flush = () => {
        if (cur.length) chapters.push({ title: t('partN', { n: chapters.length + 1 }), content: cur.join('\n') });
        cur = []; cnt = 0;
      };
      for (const u of units) {
        if (cur.length && cnt + u.n > chunkSize) flush();
        cur.push(u.text);
        cnt += u.n;
      }
      flush();
      return chapters.length ? chapters : defaultBook(state.lang).chapters;
    }

    function importPastedText() {
      if (!canAddBook()) return alert(t('limitReached'));
      const title = document.getElementById('customTitle').value.trim() || t('defaultTitle');
      const text = document.getElementById('customText').value.trim();
      if (!text) return alert(t('pasteFirst'));
      loadNewBook(title, splitTextIntoChapters(text));
    }

    // Kolejność plików wg "spine" z pliku OPF (a nie alfabetycznie)
    async function getEpubOrder(zip) {
      try {
        const container = await zip.file('META-INF/container.xml').async('text');
        const opfPath = new DOMParser().parseFromString(container, 'application/xml')
          .querySelector('rootfile').getAttribute('full-path');
        const opf = new DOMParser().parseFromString(await zip.file(opfPath).async('text'), 'application/xml');
        const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
        const manifest = {};
        opf.querySelectorAll('manifest > item').forEach(it => { manifest[it.getAttribute('id')] = it.getAttribute('href'); });
        const order = [];
        opf.querySelectorAll('spine > itemref').forEach(ref => {
          const href = manifest[ref.getAttribute('idref')];
          if (!href) return;
          const name = decodeURIComponent(base + href.split('#')[0]);
          if (zip.file(name)) order.push(name);
        });
        return order;
      } catch (e) {
        return [];
      }
    }

    // ===== Wczytywanie plików: txt, epub, mobi, pdf, doc, docx =====
    class UserError extends Error {
      constructor(key) { super(key); this.key = key; }
    }

    function setBusy(on) {
      const el = document.getElementById('busy');
      if (el) el.classList.toggle('hidden', !on);
    }

    function needZip() {
      if (!window.JSZip) throw new UserError('libFail');
    }

    // --- pomocnicze: tekst ---
    function decodeText(buf) {
      const u8 = new Uint8Array(buf);
      if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf.slice(2));
      if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf.slice(2));
      try {
        return new TextDecoder('utf-8', { fatal: true }).decode(buf);
      } catch (e) {
        const fallback = { pl: 'windows-1250', uk: 'windows-1251' }[state.lang] || 'windows-1252';
        return new TextDecoder(fallback).decode(buf);
      }
    }

    const BLOCK_TAGS = new Set(['P', 'DIV', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'TR', 'SECTION',
      'ARTICLE', 'UL', 'OL', 'TABLE', 'PRE', 'DD', 'DT', 'HR', 'FIGURE', 'CENTER']);

    // HTML -> zwykły tekst, akapity oddzielone pustą linią
    function htmlToText(doc) {
      let out = '';
      (function walk(node) {
        for (const c of node.childNodes) {
          if (c.nodeType === 3) {
            out += c.nodeValue.replace(/\s+/g, ' ');
          } else if (c.nodeType === 1) {
            const tag = c.tagName.toUpperCase();
            if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'HEAD') continue;
            if (tag === 'BR') { out += '\n'; continue; }
            const blk = BLOCK_TAGS.has(tag);
            if (blk) out += '\n';
            walk(c);
            if (blk) out += '\n';
          }
        }
      })(doc.body);
      return out.split('\n').map(s => s.trim()).filter(Boolean).join('\n\n');
    }

    function stripLeadingTitle(text, title) {
      const norm = x => x.replace(/\s+/g, ' ').trim().toLowerCase();
      const nl = text.indexOf('\n');
      const first = nl < 0 ? text : text.slice(0, nl);
      if (nl > 0 && title && norm(first) === norm(title)) return text.slice(nl).replace(/^\n+/, '');
      return text;
    }

    function titleFromDoc(doc, text, n) {
      const h = doc.querySelector('h1, h2, h3');
      let title = h ? h.textContent.replace(/\s+/g, ' ').trim() : '';
      if (!title) {
        const first = (text.split('\n')[0] || '').trim();
        if (first && first.length <= 60 && !/[.!?]$/.test(first)) title = first;
      }
      return (title || t('chapterN', { n })).slice(0, 80);
    }

    // Sekcje {title, paras:[]} -> rozdziały; krótkie wstępy dołącza do pierwszego rozdziału
    function chaptersFromHeadingSplit(paras, idxs) {
      const chapters = [];
      for (let k = 0; k < idxs.length; k++) {
        const end = k + 1 < idxs.length ? idxs[k + 1] : paras.length;
        const body = paras.slice(idxs[k] + 1, end).map(p => p.text).join('\n');
        chapters.push({ title: paras[idxs[k]].text.slice(0, 80), content: body || paras[idxs[k]].text });
      }
      const pre = paras.slice(0, idxs[0]).map(p => p.text).join('\n');
      if (pre) {
        if (pre.length >= 250) {
          const first = paras[0].text;
          chapters.unshift({ title: first.slice(0, 80), content: paras.slice(1, idxs[0]).map(p => p.text).join('\n') || first });
        } else {
          chapters[0].content = pre + '\n' + chapters[0].content;
        }
      }
      return chapters;
    }

    // --- EPUB ---
    async function parseEpub(buf) {
      needZip();
      const zip = await JSZip.loadAsync(buf);
      let files = await getEpubOrder(zip);
      if (!files.length) {
        files = Object.keys(zip.files)
          .filter(name => /\.(xhtml|html|htm)$/i.test(name) && !/nav|toc/i.test(name))
          .sort();
      }
      const chapters = [];
      for (const fname of files) {
        const raw = await zip.file(fname).async('text');
        const doc = new DOMParser().parseFromString(raw, 'text/html');
        const text = htmlToText(doc);
        if (text.length > 250) {
          const title = titleFromDoc(doc, text, chapters.length + 1);
          chapters.push({ title, content: stripLeadingTitle(text, title) });
        }
      }
      if (!chapters.length) throw new UserError('epubNone');
      return chapters;
    }

    // --- DOCX ---
    async function parseDocx(buf) {
      needZip();
      const head = new Uint8Array(buf, 0, 2);
      if (head[0] === 0xD0 && head[1] === 0xCF) return parseDoc(buf); // stary .doc z rozszerzeniem .docx
      const zip = await JSZip.loadAsync(buf);
      const docFile = zip.file('word/document.xml');
      if (!docFile) throw new UserError('unsupportedFile');
      const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
      const xml = new DOMParser().parseFromString(await docFile.async('text'), 'application/xml');
      if (xml.getElementsByTagName('parsererror').length) throw new UserError('unsupportedFile');

      const styleName = {};
      const sf = zip.file('word/styles.xml');
      if (sf) {
        const sx = new DOMParser().parseFromString(await sf.async('text'), 'application/xml');
        for (const st of sx.getElementsByTagNameNS(W, 'style')) {
          const id = st.getAttributeNS(W, 'styleId');
          const nm = st.getElementsByTagNameNS(W, 'name')[0];
          if (id && nm) styleName[id] = (nm.getAttributeNS(W, 'val') || '').toLowerCase();
        }
      }
      const child = (el, name) => Array.from(el.children).find(c => c.localName === name);
      const SKIP = new Set(['drawing', 'pict', 'txbxContent', 'delText', 'instrText', 'del']);
      function runText(node) {
        let s = '';
        for (const c of node.childNodes) {
          if (c.nodeType !== 1) continue;
          const n = c.localName;
          if (SKIP.has(n)) continue;
          if (n === 't') s += c.textContent;
          else if (n === 'tab') s += ' ';
          else if (n === 'br' || n === 'cr') s += '\n';
          else if (n === 'noBreakHyphen') s += '-';
          else s += runText(c);
        }
        return s;
      }

      const paras = [];
      for (const p of xml.getElementsByTagNameNS(W, 'p')) {
        let level = 0;
        const ppr = child(p, 'pPr');
        if (ppr) {
          const ps = child(ppr, 'pStyle');
          const sid = ps ? ps.getAttributeNS(W, 'val') : '';
          const nm = (styleName[sid] || sid || '').toLowerCase();
          if (/^toc/.test(nm)) continue; // spis treści
          const m = nm.match(/^heading\s*([1-3])$/);
          if (m) level = +m[1];
          const ol = child(ppr, 'outlineLvl');
          if (!level && ol) { const v = parseInt(ol.getAttributeNS(W, 'val'), 10); if (v >= 0 && v < 3) level = v + 1; }
        }
        const text = runText(p).replace(/[ \t ]+/g, ' ').replace(/ ?\n ?/g, '\n').trim();
        if (text) paras.push({ text, level });
      }
      if (!paras.length) throw new UserError('noText');

      for (const lvl of [1, 2, 3]) {
        const idxs = [];
        paras.forEach((p, i) => { if (p.level === lvl) idxs.push(i); });
        if (idxs.length >= 2) return chaptersFromHeadingSplit(paras, idxs);
      }
      return splitTextIntoChapters(paras.map(p => p.text).join('\n'));
    }

    // --- DOC (Word 97-2003): czytnik pliku złożonego (CFB) + tablica kawałków tekstu ---
    function parseCFB(buf) {
      const u8 = new Uint8Array(buf);
      const dv = new DataView(buf);
      const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
      for (let i = 0; i < 8; i++) if (u8[i] !== sig[i]) throw new UserError('unsupportedFile');
      const ssz = 1 << dv.getUint16(0x1E, true);
      const mssz = 1 << dv.getUint16(0x20, true);
      const sectorOff = sid => (sid + 1) * ssz;
      const MAXREG = 0xFFFFFFFA;

      const fatSecs = [];
      for (let i = 0; i < 109; i++) {
        const v = dv.getUint32(0x4C + i * 4, true);
        if (v < MAXREG) fatSecs.push(v);
      }
      let dif = dv.getUint32(0x44, true);
      const nDif = dv.getUint32(0x48, true);
      for (let k = 0; k < nDif && dif < MAXREG; k++) {
        const off = sectorOff(dif);
        for (let i = 0; i < ssz / 4 - 1; i++) {
          const v = dv.getUint32(off + i * 4, true);
          if (v < MAXREG) fatSecs.push(v);
        }
        dif = dv.getUint32(off + ssz - 4, true);
      }
      const fat = [];
      for (const s of fatSecs) {
        const off = sectorOff(s);
        for (let i = 0; i < ssz / 4; i++) fat.push(dv.getUint32(off + i * 4, true));
      }
      const chain = start => {
        const out = [];
        let s = start;
        while (s < MAXREG && out.length <= fat.length) { out.push(s); s = fat[s]; }
        return out;
      };
      const readChain = (start, size) => {
        const secs = chain(start);
        const out = new Uint8Array(secs.length * ssz);
        secs.forEach((s, i) => out.set(u8.subarray(sectorOff(s), sectorOff(s) + ssz), i * ssz));
        return size == null ? out : out.subarray(0, size);
      };

      const dir = readChain(dv.getUint32(0x30, true));
      const entries = [];
      for (let o = 0; o + 128 <= dir.length; o += 128) {
        const d = new DataView(dir.buffer, dir.byteOffset + o, 128);
        const nl = d.getUint16(0x40, true);
        let name = '';
        for (let i = 0; i < Math.max(0, nl / 2 - 1); i++) name += String.fromCharCode(d.getUint16(i * 2, true));
        entries.push({ name, type: d.getUint8(0x42), start: d.getUint32(0x74, true), size: d.getUint32(0x78, true) });
      }
      const root = entries[0];
      const cutoff = dv.getUint32(0x38, true);
      const miniStream = readChain(root.start, root.size);
      const mf = readChain(dv.getUint32(0x3C, true));
      const miniFat = new DataView(mf.buffer, mf.byteOffset, mf.byteLength);
      const miniCount = Math.floor(mf.byteLength / 4);

      function stream(name) {
        const e = entries.find(x => x.type === 2 && x.name === name);
        if (!e) return null;
        if (e.size >= cutoff) return readChain(e.start, e.size);
        const out = new Uint8Array(e.size);
        let s = e.start, pos = 0, guard = 0;
        while (s < MAXREG && pos < e.size && guard++ <= miniCount) {
          const chunk = miniStream.subarray(s * mssz, s * mssz + mssz);
          out.set(chunk.subarray(0, Math.min(chunk.length, e.size - pos)), pos);
          pos += mssz;
          s = s * 4 + 4 <= mf.byteLength ? miniFat.getUint32(s * 4, true) : 0xFFFFFFFE;
        }
        return out;
      }
      return { stream };
    }

    function cleanWordText(text) {
      let out = '';
      const stack = []; // true = jesteśmy w kodzie pola (np. HYPERLINK), który pomijamy
      for (const ch of text) {
        const c = ch.charCodeAt(0);
        if (c === 0x13) { stack.push(true); continue; }
        if (c === 0x14) { if (stack.length) stack[stack.length - 1] = false; continue; }
        if (c === 0x15) { stack.pop(); continue; }
        if (stack.some(Boolean)) continue;
        if (c === 0x0D || c === 0x0C || c === 0x0B) out += '\n';
        else if (c === 0x07 || c === 0x09) out += ' ';
        else if (c === 0x1E) out += '-';
        else if (c < 0x20) continue;
        else out += ch;
      }
      return out.replace(/[ \t]+\n/g, '\n').replace(/\n[ \t]+/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    function parseDoc(buf) {
      const head = new Uint8Array(buf, 0, 2);
      if (head[0] === 0x50 && head[1] === 0x4B) return parseDocx(buf); // plik .docx z rozszerzeniem .doc
      const cfb = parseCFB(buf);
      const wd = cfb.stream('WordDocument');
      if (!wd) throw new UserError('unsupportedFile');
      const dv = new DataView(wd.buffer, wd.byteOffset, wd.byteLength);
      if (dv.getUint16(0, true) !== 0xA5EC) throw new UserError('unsupportedFile');
      const nFib = dv.getUint16(2, true);
      const flags = dv.getUint16(0x0A, true);
      if (flags & 0x0100) throw new UserError('fileProtected');

      let text = '';
      if (nFib < 0xC1) { // Word 6 / 95: tekst leży liniowo
        const fcMin = dv.getUint32(0x18, true), fcMac = dv.getUint32(0x1C, true);
        text = new TextDecoder('windows-1252').decode(wd.subarray(fcMin, fcMac));
      } else {
        const table = cfb.stream((flags & 0x0200) ? '1Table' : '0Table');
        if (!table) throw new UserError('unsupportedFile');
        const td = new DataView(table.buffer, table.byteOffset, table.byteLength);
        const ccpText = dv.getInt32(0x4C, true);
        const fcClx = dv.getUint32(0x1A2, true), lcbClx = dv.getUint32(0x1A6, true);
        let p = fcClx, plcStart = -1, plcLen = 0;
        while (p < fcClx + lcbClx) {
          const clxt = td.getUint8(p);
          if (clxt === 1) p += 3 + td.getUint16(p + 1, true);
          else if (clxt === 2) { plcLen = td.getUint32(p + 1, true); plcStart = p + 5; break; }
          else break;
        }
        if (plcStart < 0) throw new UserError('unsupportedFile');
        const n = Math.floor((plcLen - 4) / 12);
        const dec1252 = new TextDecoder('windows-1252'), dec16 = new TextDecoder('utf-16le');
        const parts = [];
        let total = 0;
        for (let i = 0; i < n && total < ccpText; i++) {
          const cpS = td.getUint32(plcStart + i * 4, true);
          const cpE = td.getUint32(plcStart + (i + 1) * 4, true);
          const fcRaw = td.getUint32(plcStart + (n + 1) * 4 + i * 8 + 2, true);
          const len = Math.min(cpE - cpS, ccpText - total);
          if (len <= 0) continue;
          if (fcRaw & 0x40000000) {
            const off = (fcRaw & 0x3FFFFFFF) / 2;
            parts.push(dec1252.decode(wd.subarray(off, off + len)));
          } else {
            const off = fcRaw & 0x3FFFFFFF;
            parts.push(dec16.decode(wd.subarray(off, off + len * 2)));
          }
          total += len;
        }
        text = parts.join('');
      }
      text = cleanWordText(text);
      if (!text) throw new UserError('noText');
      return splitTextIntoChapters(text);
    }

    // --- MOBI (PalmDOC / MOBI 6) ---
    function palmDocDecompress(src) {
      const out = [];
      let i = 0;
      while (i < src.length) {
        const c = src[i++];
        if (c === 0 || (c >= 9 && c <= 0x7F)) out.push(c);
        else if (c >= 1 && c <= 8) { for (let k = 0; k < c && i < src.length; k++) out.push(src[i++]); }
        else if (c >= 0xC0) { out.push(0x20, c ^ 0x80); }
        else {
          const w = (c << 8) | src[i++];
          const dist = (w >> 3) & 0x7FF, len = (w & 7) + 3;
          if (dist === 0 || dist > out.length) break;
          for (let k = 0; k < len; k++) out.push(out[out.length - dist]);
        }
      }
      return out;
    }

    function parseMobi(buf) {
      const u8 = new Uint8Array(buf);
      const dv = new DataView(buf);
      const nrec = dv.getUint16(76, false);
      if (nrec < 2) throw new UserError('unsupportedFile');
      const offs = [];
      for (let i = 0; i < nrec; i++) offs.push(dv.getUint32(78 + i * 8, false));
      const rec = i => u8.subarray(offs[i], i + 1 < nrec ? offs[i + 1] : u8.length);
      const r0 = rec(0);
      const d0 = new DataView(r0.buffer, r0.byteOffset, r0.byteLength);
      const comp = d0.getUint16(0, false);
      const count = d0.getUint16(8, false);
      const encryption = d0.getUint16(12, false);
      if (String.fromCharCode(r0[16], r0[17], r0[18], r0[19]) !== 'MOBI') throw new UserError('mobiUnsupported');
      if (encryption !== 0) throw new UserError('fileProtected');
      const hlen = d0.getUint32(20, false);
      const codepage = d0.getUint32(28, false);
      const version = d0.getUint32(36, false);
      if (comp === 17480 || version === 8 || (comp !== 1 && comp !== 2)) throw new UserError('mobiUnsupported');
      const extra = (hlen >= 0xE4 && r0.length >= 0xF4) ? d0.getUint16(0xF2, false) : 0;

      function trailing(r) {
        let num = 0;
        const size = r.length;
        const entry = psize => {
          let bitpos = 0, result = 0;
          for (;;) {
            const v = r[psize - 1];
            result |= (v & 0x7F) << bitpos;
            bitpos += 7;
            psize -= 1;
            if ((v & 0x80) !== 0 || bitpos >= 28 || psize === 0) return result;
          }
        };
        let flags = extra >> 1;
        while (flags) {
          if (flags & 1) num += entry(size - num);
          flags >>= 1;
        }
        if (extra & 1) num += (r[size - num - 1] & 3) + 1;
        return num;
      }

      const chunks = [];
      let total = 0;
      for (let i = 1; i <= count && i < nrec; i++) {
        let r = rec(i);
        if (extra) r = r.subarray(0, Math.max(0, r.length - trailing(r)));
        const bytes = comp === 2 ? Uint8Array.from(palmDocDecompress(r)) : r;
        chunks.push(bytes);
        total += bytes.length;
      }
      const all = new Uint8Array(total);
      let pos = 0;
      for (const c of chunks) { all.set(c, pos); pos += c.length; }
      const html = new TextDecoder(codepage === 65001 ? 'utf-8' : 'windows-1252').decode(all);

      const chapters = [];
      let carry = '';
      let carryDoc = null;
      for (const part of html.split(/<mbp:pagebreak\s*\/?>/i)) {
        const doc = new DOMParser().parseFromString(part, 'text/html');
        const text = htmlToText(doc);
        if (!text) continue;
        const acc = carry ? carry + '\n\n' + text : text;
        if (acc.length < 250) { carry = acc; carryDoc = carryDoc || doc; continue; }
        const mTitle = titleFromDoc(carryDoc && !doc.querySelector('h1, h2, h3') ? carryDoc : doc, acc, chapters.length + 1);
        chapters.push({ title: mTitle, content: stripLeadingTitle(acc, mTitle) });
        carry = '';
        carryDoc = null;
      }
      if (carry) {
        if (chapters.length) chapters[chapters.length - 1].content += '\n\n' + carry;
        else chapters.push({ title: t('chapterN', { n: 1 }), content: carry });
      }
      if (chapters.length >= 2) return chapters;
      const whole = chapters.length ? chapters[0].content : htmlToText(new DOMParser().parseFromString(html, 'text/html'));
      if (!whole) throw new UserError('noText');
      return splitTextIntoChapters(whole);
    }

    // --- PDF (pdf.js ładowany dopiero przy otwarciu pliku PDF) ---
    let pdfjsLib = null;
    async function loadPdfJs() {
      if (pdfjsLib) return pdfjsLib;
      const m = await import('./lib/pdf.min.mjs');
      m.GlobalWorkerOptions.workerSrc = new URL('./lib/pdf.worker.min.mjs', location.href).href;
      pdfjsLib = m;
      return m;
    }

    function median(arr) {
      const a = arr.slice().sort((x, y) => x - y);
      return a.length ? a[Math.floor(a.length / 2)] : 0;
    }

    // Elementy tekstu jednej strony -> akapity
    function pageToParagraphs(items) {
      const lines = [];
      let cur = null;
      for (const it of items) {
        if (typeof it.str !== 'string') continue;
        const x = it.transform[4], y = it.transform[5];
        const h = it.height || Math.abs(it.transform[3]) || 10;
        if (!cur || Math.abs(y - cur.y) > h * 0.5) {
          if (cur) lines.push(cur);
          cur = { x, y, h, text: '', endX: null };
        }
        if (!it.str) continue;
        if (cur.text && cur.endX !== null && x - cur.endX > h * 0.15 && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += ' ';
        cur.text += it.str;
        cur.endX = x + (it.width || 0);
        cur.h = Math.max(cur.h, h);
      }
      if (cur) lines.push(cur);
      const ls = lines.map(l => ({ ...l, text: l.text.replace(/\s+/g, ' ').trim() })).filter(l => l.text);
      const isPageNo = s => /^[-–—]?\s*\d{1,4}\s*[-–—]?$/.test(s);
      if (ls.length > 1 && isPageNo(ls[ls.length - 1].text)) ls.pop();
      if (ls.length > 1 && isPageNo(ls[0].text)) ls.shift();
      if (!ls.length) return [];

      const gaps = [];
      for (let i = 1; i < ls.length; i++) { const g = ls[i - 1].y - ls[i].y; if (g > 0) gaps.push(g); }
      const med = median(gaps);
      const leftMargin = Math.min(...ls.map(l => l.x));
      const paras = [];
      let buf = ls[0].text;
      for (let i = 1; i < ls.length; i++) {
        const gap = ls[i - 1].y - ls[i].y;
        const bigGap = med > 0 && gap > med * 1.45;
        const indented = ls[i].x - leftMargin > ls[i].h * 0.8 && /[.!?…»”"')\]]$/.test(buf);
        if (bigGap || indented) { paras.push(buf); buf = ls[i].text; }
        else if (/[A-Za-zÀ-ž]-$/.test(buf) && /^\p{Ll}/u.test(ls[i].text)) buf = buf.slice(0, -1) + ls[i].text;
        else buf += ' ' + ls[i].text;
      }
      paras.push(buf);
      return paras;
    }

    function joinPages(pages, from, to) {
      const paras = [];
      for (let p = from; p < to; p++) {
        pages[p].forEach((para, j) => {
          const last = paras.length - 1;
          if (j === 0 && last >= 0 && /^\p{Ll}/u.test(para) && !/[.!?…:;»”"')\]]$/.test(paras[last])) {
            paras[last] = /[A-Za-zÀ-ž]-$/.test(paras[last]) ? paras[last].slice(0, -1) + para : paras[last] + ' ' + para;
          } else paras.push(para);
        });
      }
      return paras;
    }

    async function pdfOutlineSections(pdf, pages) {
      let outline = await pdf.getOutline();
      if (outline && outline.length === 1 && outline[0].items && outline[0].items.length >= 2) outline = outline[0].items;
      if (!outline || outline.length < 2) return null;
      const marks = [];
      for (const o of outline) {
        let dest = o.dest;
        if (typeof dest === 'string') dest = await pdf.getDestination(dest);
        if (!Array.isArray(dest)) continue;
        const ref = dest[0];
        let page;
        if (ref && typeof ref === 'object') page = await pdf.getPageIndex(ref);
        else if (Number.isInteger(ref)) page = ref;
        else continue;
        marks.push({ title: (o.title || '').replace(/\s+/g, ' ').trim().slice(0, 80), page });
      }
      marks.sort((a, b) => a.page - b.page);
      const uniq = marks.filter((m, i) => i === 0 || m.page !== marks[i - 1].page);
      if (uniq.length < 2) return null;
      const chapters = [];
      uniq.forEach((m, k) => {
        const to = k + 1 < uniq.length ? uniq[k + 1].page : pages.length;
        const content = stripLeadingTitle(joinPages(pages, m.page, to).join('\n'), m.title);
        if (content) chapters.push({ title: m.title || t('chapterN', { n: chapters.length + 1 }), content });
      });
      const preParas = joinPages(pages, 0, uniq[0].page);
      const pre = preParas.join('\n');
      if (pre && chapters.length) {
        if (pre.length >= 250) chapters.unshift({ title: preParas[0].slice(0, 80), content: preParas.slice(1).join('\n') || preParas[0] });
        else chapters[0].content = pre + '\n' + chapters[0].content;
      }
      return chapters.length >= 2 ? chapters : null;
    }

    async function parsePdf(buf) {
      let lib;
      try { lib = await loadPdfJs(); } catch (e) { throw new UserError('libFail'); }
      let pdf;
      try {
        pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
      } catch (e) {
        if (e && e.name === 'PasswordException') throw new UserError('pdfPassword');
        throw e;
      }
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        pages.push(pageToParagraphs(tc.items));
        page.cleanup();
      }
      const chars = pages.reduce((a, p) => a + p.join('').length, 0);
      if (chars < 20) throw new UserError('pdfNoText');
      try {
        const sections = await pdfOutlineSections(pdf, pages);
        if (sections) return sections;
      } catch (e) { /* brak spisu treści – dzielimy po tekście */ }
      return splitTextIntoChapters(joinPages(pages, 0, pages.length).join('\n'));
    }

    // --- Obsługa wyboru pliku ---
    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!canAddBook()) { alert(t('limitReached')); e.target.value = ''; return; }
      const ext = ((file.name.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
      const title = file.name.replace(/\.[^.]+$/, '');
      let chapters = null;
      setBusy(true);
      try {
        const buf = await file.arrayBuffer();
        if (ext === 'txt') chapters = splitTextIntoChapters(decodeText(buf));
        else if (ext === 'epub') chapters = await parseEpub(buf);
        else if (ext === 'mobi' || ext === 'azw') chapters = parseMobi(buf);
        else if (ext === 'docx') chapters = await parseDocx(buf);
        else if (ext === 'doc') chapters = parseDoc(buf);
        else if (ext === 'pdf') chapters = await parsePdf(buf);
        else throw new UserError('unsupportedFile');
        if (!chapters || !chapters.length) throw new UserError('noText');
      } catch (err) {
        chapters = null;
        setBusy(false);
        e.target.value = '';
        alert(err instanceof UserError ? t(err.key) : t('fileError') + (err && err.message ? err.message : err));
        return;
      }
      setBusy(false);
      e.target.value = '';
      await loadNewBook(title, chapters);
    }

    // Dodaje książkę do biblioteki (maks. 5). Jedyną książkę przykładową zastępuje.
    async function loadNewBook(title, chapters) {
      if (!canAddBook()) { alert(t('limitReached')); return; }
      const book = { title, chapters };
      const id = newId();
      let store = 'idb', idbKey = 'book:' + id;
      try {
        await idbSet(idbKey, book);
      } catch (e) {
        store = 'ls'; // brak IndexedDB – próbujemy localStorage
        idbKey = null;
      }
      // stan biblioteki sprawdzamy dopiero teraz (w międzyczasie mógł się zmienić)
      if (!canAddBook()) {
        if (idbKey) idbDelete(idbKey).catch(() => {});
        alert(t('limitReached'));
        return;
      }
      const replaceSample = state.books.length === 1 && state.books[0].isDefault;
      const rec = makeRec({
        id, title, chapterCount: chapters.length, store, idbKey,
        startDateISO: new Date(nowMs()).toISOString(),
        color: pickColor(replaceSample ? [] : state.books)
      });
      if (store === 'ls') rec.book = book;
      const prevBooks = state.books, prevActive = state.activeBookId;
      state.books = replaceSample ? [rec] : prevBooks.concat(rec);
      state.activeBookId = rec.id;
      if (!saveState()) {
        state.books = prevBooks;
        state.activeBookId = prevActive;
        if (idbKey) idbDelete(idbKey).catch(() => {});
        alert(t('tooBig'));
        return;
      }
      bookCache[rec.id] = book;
      if (replaceSample) {
        if (prevBooks[0].idbKey) idbDelete(prevBooks[0].idbKey).catch(() => {});
        delete bookCache[prevBooks[0].id];
      }
      alert(t('loaded', { t: title, n: chapters.length }) + '\n' + t('setScheduleHint'));
      switchTab('settings');
    }

    async function deleteBook(id) {
      const rec = state.books.find(r => r.id === id);
      if (!rec) return;
      if (!confirm(t('confirmDelete', { t: recTitle(rec) }))) return;
      state.books = state.books.filter(r => r.id !== id);
      delete bookCache[id];
      if (rec.idbKey) idbDelete(rec.idbKey).catch(() => {});
      if (!state.books.length) addSampleBook();
      if (!state.books.some(r => r.id === state.activeBookId)) state.activeBookId = state.books[0].id;
      if (calFilter === id) calFilter = 'all';
      saveState();
      renderLibrary();
      renderReader();
    }

    // Plik .ics: wszystkie książki albo tylko ta, którą wybrano w filtrze kalendarza
    function exportICS() {
      const pad = n => String(n).padStart(2, '0');
      const toICSDate = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
      const esc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
      const recs = calRecs();
      const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PaKu//PWA//PL', 'CALSCALE:GREGORIAN'];
      recs.forEach(rec => {
        const book = bookOf(rec);
        if (!book) return;
        book.chapters.forEach((ch, i) => {
          const start = unlockDateOf(rec, i);
          const end = new Date(start.getTime() + 30 * 60000);
          lines.push(
            'BEGIN:VEVENT',
            `UID:drip-${rec.id}-ch-${i}@czytnik`,
            `DTSTAMP:${toICSDate(new Date())}`,
            `DTSTART:${toICSDate(start)}`,
            `DTEND:${toICSDate(end)}`,
            `SUMMARY:${esc('📖 ' + book.title + ' — ' + ch.title)}`,
            `DESCRIPTION:${esc(t('icsDesc'))}`,
            'END:VEVENT'
          );
        });
      });
      lines.push('END:VCALENDAR');
      const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = calFilter === 'all' || state.books.length < 2
        ? 'harmonogram-czytania.ics'
        : 'harmonogram-' + recTitle(recs[0]).replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 40) + '.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function simulateNextDay() {
      state.timeOffsetMs = (state.timeOffsetMs || 0) + 24 * 3600 * 1000;
      saveState();
      renderReader();
    }

    function resetSimulation() {
      state.timeOffsetMs = 0;
      saveState();
      renderReader();
    }

    // Zeruje postęp tylko wybranej książki
    function resetProgress() {
      if (!confirm(t('confirmReset'))) return;
      const rec = activeRec();
      rec.currentIndex = 0;
      rec.completed = [];
      rec.unlocked = [];
      rec.finishedAt = null;
      rec.finishedEarly = false;
      rec.startDateISO = new Date(nowMs()).toISOString();
      saveState();
      renderReader();
      renderLibrary();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    // Ekran startowy znika po 2 s (animacja CSS), potem usuwamy go z DOM
    (function () {
      const sp = document.getElementById('splash');
      let shown = false;
      const go = () => { if (shown) return; shown = true; showRewards({ auto: true }); };
      if (sp) sp.addEventListener('animationend', ev => { if (ev.animationName === 'splashOut') { sp.remove(); go(); } });
      setTimeout(go, 2600); // zabezpieczenie, gdyby animacja się nie wykonała
    })();

    // Init
    applyI18n();
    updateRewardIcon();
    setTheme(state.theme || 'light');
    document.documentElement.style.setProperty('--reader-size', (state.fontSize || 18) + 'px');
    restoreBooks().then(() => { renderReader(); renderLibrary(); });
    setInterval(() => {
      if (!document.getElementById('tab-reader').classList.contains('hidden')) tickCountdown();
    }, 1000);
  </script>

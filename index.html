<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F1FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PaKu" />
  <title>PaKu — Drip Book Reader</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <script>
    // Motyw ustawiany od razu, żeby ekran startowy nie migał jasnym tłem w trybie nocnym
    try { var _s = JSON.parse(localStorage.getItem('dripReaderStateV2')); if (_s && _s.theme && _s.theme !== 'light') document.documentElement.setAttribute('data-theme', _s.theme); } catch (e) {}
  </script>
  <script src="./lib/jszip.min.js"></script>
  <style>
    :root {
      --bg: #EADFFB;
      --surface: #F6F1FF;
      --text: #2B2140;
      --muted: #6B5B8A;
      --accent: #7C3AED;
      --accent-soft: #DDCCFA;
      --border: #D3C2F2;
      --on-accent: #FFFFFF;
      --reader-size: 18px;
    }
    [data-theme="sepia"] {
      --bg: #F4ECD8;
      --surface: #FAF3E3;
      --text: #3B2F2F;
      --muted: #7C6A5A;
      --accent: #9A3412;
      --accent-soft: #FDE68A;
      --border: #DFD3BC;
    }
    [data-theme="dark"] {
      --bg: #1B1530;
      --surface: #271F42;
      --text: #ECE6FA;
      --muted: #B3A7D1;
      --accent: #B8A1FF;
      --accent-soft: #3A2E63;
      --border: #3D3360;
      --on-accent: #1B1530;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: calc(74px + env(safe-area-inset-bottom));
      transition: background 0.25s, color 0.25s;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    main {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    h1, h2, h3 { margin-top: 0; }
    .chapter-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .chapter-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .reader-body {
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--reader-size);
      line-height: 1.75;
      white-space: pre-wrap;
    }
    .reader-body p { margin: 0 0 1.1em; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: var(--on-accent);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-small { padding: 8px 12px; font-size: 13px; width: auto; }
    .lock-box {
      text-align: center;
      padding: 28px 16px;
    }
    .countdown {
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      margin: 12px 0;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }
    .controls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    input[type="text"], input[type="number"], input[type="time"], input[type="date"], select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 12px;
    }
    .schedule-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .schedule-item:last-child { border-bottom: none; }
    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .st-done { background: #DCFCE7; color: #166534; }
    .st-open { background: var(--accent-soft); color: var(--accent); }
    .st-lock { background: var(--border); color: var(--muted); }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 30;
    }
    nav button {
      flex: 1;
      border: none;
      background: none;
      color: var(--muted);
      padding: 10px 4px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    nav button.active { color: var(--accent); }
    select.lang-select {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg);
      animation: splashOut 0.4s ease 2s forwards;
    }
    #splash img {
      width: 128px;
      height: 128px;
      border-radius: 29px;
      box-shadow: 0 10px 30px rgba(80, 40, 160, 0.25);
      margin-bottom: 14px;
      animation: splashPop 0.7s cubic-bezier(.2,.9,.3,1.2) both;
    }
    .splash-name { font-size: 38px; font-weight: 800; letter-spacing: 1px; color: var(--text); animation: splashFade 0.6s ease 0.25s both; }
    .splash-tag { font-size: 15px; color: var(--muted); animation: splashFade 0.6s ease 0.45s both; }
    @keyframes splashPop { from { opacity: 0; transform: scale(0.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
    @keyframes splashFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes splashOut { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, .splash-name, .splash-tag { animation: none; }
    }
    .hdr-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn { border: 1px solid var(--border); background: var(--accent-soft); border-radius: 999px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; line-height: 1; }
    .pct-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin: 0 0 14px; }
    .pct-read { color: var(--accent); }
    .pct-left { color: var(--muted); }
    #rewards { position: fixed; inset: 0; z-index: 900; background: var(--bg); overflow-y: auto; display: flex; justify-content: center; }
    .rw-box { width: 100%; max-width: 480px; padding: 22px 16px calc(24px + env(safe-area-inset-bottom)); margin: auto 0; }
    .rw-title { text-align: center; font-size: 22px; margin: 0 0 14px; }
    .rw-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
    .rw-period { font-weight: 800; font-size: 14px; color: var(--accent); margin-bottom: 6px; }
    .rw-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; }
    .rw-row + .rw-row { border-top: 1px solid var(--border); }
    .rw-lab { font-size: 12px; color: var(--muted); font-weight: 600; }
    .rw-num { font-size: 24px; font-weight: 800; line-height: 1.1; }
    .rw-dist { text-align: right; display: flex; flex-direction: column; font-size: 14px; }
    .rw-dist span { font-size: 11px; color: var(--muted); }
    .rw-note { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
    .rw-bar { height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
    #rwFill { height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
    .rw-foot { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 2px; }
    .rw-journey { border-color: var(--accent); }
    .rw-jline { font-size: 14px; margin: 3px 0; }
    .rw-jbar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
    .rw-jbar > div { height: 100%; background: var(--accent); min-width: 3px; }
    .rw-jmeta { font-size: 11px; color: var(--muted); }
    .rw-ms { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 5px 0; color: var(--muted); }
    .rw-ms + .rw-ms { border-top: 1px solid var(--border); }
    .rw-ms.done { color: var(--text); font-weight: 600; }
    @keyframes rwCountdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    #busy {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 20, 60, 0.35);
    }
    .busy-box {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
      font-weight: 600;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .chip .dot { margin-right: 6px; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85); }
    .lib-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .lib-item.active { border-color: var(--accent); background: var(--accent-soft); }
    .lib-main { flex: 1; min-width: 0; }
    .lib-title { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .lib-del { border: none; background: none; font-size: 18px; cursor: pointer; padding: 6px; }
    .cal-book { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
    .hidden { display: none !important; }
    #installBanner {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="./icon.svg" alt="" />
    <div class="splash-name">PaKu</div>
    <div class="splash-tag" data-i18n="splashTag">Rozdział po rozdziale</div>
  </div>
  <div id="rewards" class="hidden" role="dialog" aria-modal="true">
    <div class="rw-box">
      <h2 id="rwTitle" class="rw-title"></h2>
      <div id="rwCards"></div>
      <p id="rwNote" class="rw-note"></p>
      <div class="rw-foot">
        <div id="rwBar" class="rw-bar hidden"><div id="rwFill"></div></div>
        <button class="btn" id="rwSkip" onclick="closeRewards()"></button>
      </div>
    </div>
  </div>
  <div id="busy" class="hidden"><div class="busy-box" data-i18n="busy">⏳ Wczytywanie książki…</div></div>
  <header>
    <div class="brand">📖 PaKu</div>
    <div class="hdr-right">
    <button class="icon-btn" id="rwBtn" aria-label="Rewards" onclick="showRewards()">🌙</button>
    <select id="langSelect" class="lang-select" aria-label="Language" onchange="setLanguage(this.value)">
      <option value="pl">Polski</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="uk">Українська</option>
    </select>
    </div>
  </header>

  <main>
    <div id="installBanner" class="hidden">
      <div style="font-size:13px;"><strong data-i18n="installTitle">Zainstaluj aplikację</strong><br/><span data-i18n="installText">Dodaj ikonę na ekran główny telefonu.</span></div>
      <button class="btn btn-small" id="btnInstallPwa" data-i18n="installBtn">Zainstaluj</button>
    </div>

    <!-- TAB 1: CZYTNIK -->
    <section id="tab-reader">
      <div id="bookChips" class="controls-row hidden"></div>
      <div class="controls-row">
        <button class="chip" data-i18n="themeLight" onclick="setTheme('light')">☀️ Jasny</button>
        <button class="chip" data-i18n="themeSepia" onclick="setTheme('sepia')">📜 Sepia</button>
        <button class="chip" data-i18n="themeDark" onclick="setTheme('dark')">🌙 Noc</button>
        <button class="chip" onclick="changeFont(-1)">A-</button>
        <button class="chip" onclick="changeFont(1)">A+</button>
      </div>

      <div id="readerContent" class="card"></div>
    </section>

    <!-- TAB 2: HARMONOGRAM / KALENDARZ -->
    <section id="tab-calendar" class="hidden">
      <div class="card">
        <h3 data-i18n="calTitle">📅 Harmonogram odblokowań</h3>
        <p style="font-size:13px;color:var(--muted);margin-top:-6px;" data-i18n="calDesc">Zsynchronizuj plan czytania z Kalendarzem Google, Apple lub Outlook.</p>
        <div id="calFilters" class="controls-row hidden"></div>
        <button class="btn" data-i18n="calExport" onclick="exportICS()">⬇️ Pobierz plik do kalendarza (.ics)</button>
        <p id="calScope" style="font-size:12px;color:var(--muted);margin:8px 0 0;"></p>
      </div>
      <div class="card" id="scheduleList"></div>
    </section>

    <!-- TAB 3: KSIĄŻKA I USTAWIENIA -->
    <section id="tab-settings" class="hidden">
      <div class="card">
        <h3 id="libraryTitle">📚</h3>
        <div id="libraryList"></div>
      </div>

      <div class="card">
        <h3 id="scheduleForTitle">⏱️</h3>
        <label data-i18n="freqLabel">Co ile dni odblokować kolejny rozdział?</label>
        <select id="freqDays" onchange="updateScheduleSettings()">
          <option value="1" data-i18n="freq1">Codziennie (co 1 dzień)</option>
          <option value="2" data-i18n="freq2">Co 2 dni</option>
          <option value="3" data-i18n="freq3">Co 3 dni</option>
          <option value="7" data-i18n="freq7">Raz w tygodniu (co 7 dni)</option>
          <option value="14" data-i18n="freq14">Co 2 tygodnie (co 14 dni)</option>
        </select>

        <label data-i18n="timeLabel">Godzina odblokowania nowego rozdziału</label>
        <input type="time" id="unlockTime" value="08:00" onchange="updateScheduleSettings()" />

        <label data-i18n="startDateLabel">Data odblokowania pierwszego rozdziału</label>
        <input type="date" id="startDate" onchange="updateScheduleSettings()" />
      </div>

      <div class="card">
        <h3 data-i18n="bookTitle">📚 Wgraj własny e-book (.epub lub .txt)</h3>
        <p id="limitNote" class="hidden" style="color:var(--accent);font-size:13px;font-weight:600;" data-i18n="limitReached"></p>
        <input type="file" id="bookFile" accept=".epub,.mobi,.azw,.pdf,.doc,.docx,.txt" onchange="handleFileUpload(event)" />

        <label data-i18n="pasteLabel">Lub wklej tekst książki ręcznie</label>
        <input type="text" id="customTitle" data-i18n-ph="titlePh" placeholder="Tytuł książki..." />
        <textarea id="customText" rows="5" data-i18n-ph="textPh" placeholder="Wklej treść książki. Aplikacja automatycznie podzieli ją według nagłówków 'Rozdział' lub co ~1200 słów..."></textarea>
        <button class="btn" data-i18n="createBtn" onclick="importPastedText()">Utwórz książkę i podziel na rozdziały</button>
      </div>

      <div class="card">
        <h3 data-i18n="testTitle">🧪 Testowanie i zarządzanie</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" data-i18n="simDay" onclick="simulateNextDay()">⏩ Symuluj +1 dzień</button>
          <button class="btn btn-secondary" data-i18n="resetBtn" onclick="resetProgress()">🔄 Resetuj postęp</button>
        </div>
        <button class="btn btn-secondary" style="margin-top:8px;" data-i18n="resetSim" onclick="resetSimulation()">⏪ Cofnij symulację</button>
      </div>
    </section>
  </main>

  <nav>
    <button id="nav-reader" class="active" onclick="switchTab('reader')">📖<span data-i18n="navRead">Czytaj</span></button>
    <button id="nav-calendar" onclick="switchTab('calendar')">📅<span data-i18n="navCal">Kalendarz</span></button>
    <button id="nav-settings" onclick="switchTab('settings')">⚙️<span data-i18n="navBook">Książka</span></button>
  </nav>

  <script>
    // Rejestracja Service Workera dla pełnego działania Offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Obsługa natywnego monitu instalacji PWA
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    document.getElementById('btnInstallPwa').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBanner').classList.add('hidden');
    });

    // ===== Tłumaczenia / Translations =====
    const LOCALES = { pl: 'pl-PL', en: 'en-GB', de: 'de-DE', es: 'es-ES', uk: 'uk-UA' };

    const I18N = {
      pl: {
        docTitle: "PaKu — Drip Book Reader",
        installTitle: "Zainstaluj aplikację", installText: "Dodaj ikonę na ekran główny telefonu.", installBtn: "Zainstaluj",
        themeLight: "☀️ Jasny", themeSepia: "📜 Sepia", themeDark: "🌙 Noc",
        calTitle: "📅 Harmonogram odblokowań", calDesc: "Zsynchronizuj plan czytania z Kalendarzem Google, Apple lub Outlook.", calExport: "⬇️ Pobierz plik do kalendarza (.ics)",
        freqTitle: "⏱️ Częstotliwość udostępniania", freqLabel: "Co ile dni odblokować kolejny rozdział?",
        freq1: "Codziennie (co 1 dzień)", freq2: "Co 2 dni", freq3: "Co 3 dni", freq7: "Raz w tygodniu (co 7 dni)", freq14: "Co 2 tygodnie (co 14 dni)",
        timeLabel: "Godzina odblokowania nowego rozdziału",
        bookTitle: "📚 Wgraj własny e-book (.epub, .mobi, .pdf, .doc, .docx, .txt)", pasteLabel: "Lub wklej tekst książki ręcznie", titlePh: "Tytuł książki...",
        textPh: "Wklej treść książki. Aplikacja automatycznie podzieli ją według nagłówków 'Rozdział' lub co ~1200 słów...",
        createBtn: "Utwórz książkę i podziel na rozdziały",
        testTitle: "🧪 Testowanie i zarządzanie", simDay: "⏩ Symuluj +1 dzień", resetBtn: "🔄 Resetuj postęp",
        navRead: "Czytaj", navCal: "Kalendarz", navBook: "Książka",

    function defaultBook(lang) {
      return JSON.parse(JSON.stringify(DEFAULT_BOOKS[lang] || DEFAULT_BOOKS.en));
    }

    function detectLang() {
      const l = ((navigator.language || 'en') + '').slice(0, 2).toLowerCase();
      return I18N[l] ? l : 'en';
    }

    function t(key, vars) {
      const dict = I18N[state.lang] || I18N.en;
      let s = dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
      if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
      return s;
    }

    function loc() { return LOCALES[state.lang] || 'en-GB'; }

    function applyI18n() {
      document.documentElement.lang = state.lang;
      document.title = t('docTitle');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
      const sel = document.getElementById('langSelect');
      if (sel) sel.value = state.lang;
    }

    function setLanguage(lang) {
      if (!I18N[lang]) return;
      state.lang = lang;
      state.books.forEach(r => {
        if (r.isDefault) { const db = defaultBook(lang); bookCache[r.id] = db; r.title = db.title; }
      });
      saveState();
      applyI18n();
      renderReader();
      renderCalendar();
      renderLibrary();
    }

    const STATE_KEY = 'dripReaderStateV2';
    const MAX_BOOKS = 5;
    const BOOK_COLORS = ['#7C3AED', '#0D9488', '#EA580C', '#DB2777', '#2563EB'];
    const bookCache = {}; // id książki -> { title, chapters } (treść; poza localStorage)
    const initialLang = detectLang();

    function newId() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
    function pickColor(books) {
      const used = books.map(b => b.color);
      return BOOK_COLORS.find(c => !used.includes(c)) || BOOK_COLORS[0];
    }

    // Jedna książka w bibliotece: własny postęp i własny harmonogram
    function makeRec(over) {
      return Object.assign({
        id: newId(), title: '', isDefault: false, store: null, idbKey: null, chapterCount: 0,
        currentIndex: 0, completed: [], unlocked: [],
        freqDays: 1, unlockTime: '08:00', startDateISO: new Date().toISOString(), color: BOOK_COLORS[0],
        finishedAt: null, finishedEarly: false
      }, over || {});
    }

    function freshState() {
      const db = defaultBook(initialLang);
      const rec = makeRec({ id: 'b1', title: db.title, isDefault: true, chapterCount: db.chapters.length });
      return { lang: initialLang, theme: 'light', fontSize: 18, timeOffsetMs: 0, activeBookId: rec.id, books: [rec], log: [] };
    }

    function loadSavedState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STATE_KEY));
        if (saved && typeof saved === 'object' &&
            ((Array.isArray(saved.books) && saved.books.length) || saved.isDefaultBook === true || saved.bookStore === 'idb' ||
             (saved.book && Array.isArray(saved.book.chapters) && saved.book.chapters.length))) return saved;
      } catch (e) {}
      return null;
    }

    // Zapis ze starszych wersji (jedna książka) zamieniamy na bibliotekę z jedną książką
    function migrateState(saved) {
      if (!saved) return freshState();
      let st;
      if (Array.isArray(saved.books) && saved.books.length) {
        st = saved;
      } else {
        const isDef = saved.isDefaultBook !== undefined ? !!saved.isDefaultBook
          : !!(saved.book && saved.book.title === DEFAULT_BOOKS.pl.title);
        const rec = makeRec({
          id: 'b1',
          title: saved.book ? saved.book.title : '',
          isDefault: isDef,
          store: isDef ? null : (saved.bookStore === 'idb' ? 'idb' : 'ls'),
          idbKey: (!isDef && saved.bookStore === 'idb') ? 'book' : null,
          chapterCount: saved.book && saved.book.chapters ? saved.book.chapters.length : 0,
          currentIndex: saved.currentIndex || 0,
          completed: saved.completed || [],
          unlocked: saved.unlocked || [],
          freqDays: saved.freqDays || 1,
          unlockTime: saved.unlockTime || '08:00',
          startDateISO: saved.startDateISO || new Date().toISOString()
        });
        if (rec.store === 'ls' && saved.book) rec.book = saved.book;
        st = { lang: saved.lang, theme: saved.theme, fontSize: saved.fontSize, timeOffsetMs: saved.timeOffsetMs, activeBookId: 'b1', books: [rec] };
      }
      if (!st.lang || !I18N[st.lang]) st.lang = initialLang;
      st.theme = st.theme || 'light';
      st.fontSize = st.fontSize || 18;
      st.timeOffsetMs = st.timeOffsetMs || 0;
      st.log = Array.isArray(st.log) ? st.log.filter(e => e && Number.isFinite(e.ts)) : [];
      st.books = st.books.slice(0, MAX_BOOKS).map((r, i) => {
        const rec = Object.assign(makeRec({ color: BOOK_COLORS[i % BOOK_COLORS.length] }), r);
        if (!Array.isArray(rec.completed)) rec.completed = [];
        if (!Array.isArray(rec.unlocked)) rec.unlocked = [];
        return rec;
      });
      if (!st.books.some(r => r.id === st.activeBookId)) st.activeBookId = st.books[0].id;
      return st;
    }

    let state = migrateState(loadSavedState());

    // Postęp i ustawienia w localStorage; treść książek w IndexedDB
    function saveState() {
      try {
        const copy = Object.assign({}, state);
        copy.books = state.books.map(r => {
          const c = Object.assign({}, r);
          if (r.store !== 'ls') delete c.book;
          return c;
        });
        localStorage.setItem(STATE_KEY, JSON.stringify(copy));
        return true;
      } catch (e) {
        return false;
      }
    }

    function idbOpen() {
      return new Promise((resolve, reject) => {
        const r = indexedDB.open('paku-db', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }
    async function idbSet(key, val) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = tx.onabort = () => reject(tx.error);
      });
    }
    async function idbGet(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const req = db.transaction('kv', 'readonly').objectStore('kv').get(key);
        req.onsuccess = () => { db.close(); resolve(req.result); };
        req.onerror = () => reject(req.error);
      });
    }
    async function idbDelete(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = tx.onabort = () => reject(tx.error);
      });
    }

    function nowMs() {
      return Date.now() + (state.timeOffsetMs || 0);
    }

    function activeRec() {
      return state.books.find(r => r.id === state.activeBookId) || state.books[0];
    }
    function bookOf(rec) { return rec ? bookCache[rec.id] : null; }
    function recTitle(rec) { const b = bookOf(rec); return b ? b.title : (rec.title || ''); }
    function canAddBook() {
      return state.books.length < MAX_BOOKS || (state.books.length === 1 && state.books[0].isDefault);
    }

    function addSampleBook() {
      const db = defaultBook(state.lang);
      const rec = makeRec({
        id: newId(), title: db.title, isDefault: true, chapterCount: db.chapters.length,
        startDateISO: new Date(nowMs()).toISOString(), color: pickColor(state.books)
      });
      bookCache[rec.id] = db;
      state.books.push(rec);
      state.activeBookId = rec.id;
      return rec;
    }

    // Wczytuje treść wszystkich książek; tych, których nie da się odczytać, nie ma już w bibliotece
    async function restoreBooks() {
      const keep = [];
      for (const rec of state.books) {
        let book = null;
        if (rec.isDefault) book = defaultBook(state.lang);
        else if (rec.book && Array.isArray(rec.book.chapters) && rec.book.chapters.length) book = rec.book;
        else if (rec.store === 'idb' && rec.idbKey) {
          try {
            const b = await idbGet(rec.idbKey);
            if (b && Array.isArray(b.chapters) && b.chapters.length) book = b;
          } catch (e) {}
        }
        if (!book) continue;
        bookCache[rec.id] = book;
        rec.title = book.title;
        rec.chapterCount = book.chapters.length;
        keep.push(rec);
      }
      state.books = keep;
      if (!state.books.length) addSampleBook();
      if (!state.books.some(r => r.id === state.activeBookId)) state.activeBookId = state.books[0].id;
      saveState();
    }

    // Termin odblokowania rozdziału i danej książki (każda ma własny harmonogram)
    function unlockDateOf(rec, index) {
      if (index === 0) return new Date(rec.startDateISO);
      const base = new Date(rec.startDateISO);
      const [hh, mm] = (rec.unlockTime || '08:00').split(':').map(Number);
      base.setDate(base.getDate() + index * rec.freqDays);
      base.setHours(Number.isFinite(hh) ? hh : 8, Number.isFinite(mm) ? mm : 0, 0, 0);
      return base;
    }

    function isOpenRec(rec, i) {
      return nowMs() >= unlockDateOf(rec, i).getTime() || rec.unlocked.includes(i);
    }

    function localDateStr(d) {
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    function setTheme(t) {
      state.theme = t;
      document.documentElement.setAttribute('data-theme', t === 'light' ? '' : t);
      saveState();
    }

    function changeFont(delta) {
      state.fontSize = Math.min(26, Math.max(14, (state.fontSize || 18) + delta));
      document.documentElement.style.setProperty('--reader-size', state.fontSize + 'px');
      saveState();
    }

    function switchTab(tab) {
      ['reader', 'calendar', 'settings'].forEach(name => {
        document.getElementById('tab-' + name).classList.toggle('hidden', name !== tab);
        document.getElementById('nav-' + name).classList.toggle('active', name === tab);
      });
      if (tab === 'calendar') renderCalendar();
      if (tab === 'reader') renderReader();
      if (tab === 'settings') renderLibrary();
    }

    let lockedUntilMs = null;

    function formatCountdown(diff) {
      const pad = n => String(n).padStart(2, '0');
      const days = Math.floor(diff / 86400000);
      const hrs = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      return (days ? days + 'd ' : '') + pad(hrs) + 'h ' + pad(mins) + 'm ' + pad(secs) + 's';
    }

    function shortTitle(s) { return s.length > 18 ? s.slice(0, 17) + '…' : s; }

    function setActiveBook(id) {
      if (!state.books.some(r => r.id === id)) return;
      state.activeBookId = id;
      saveState();
      renderReader();
      renderLibrary();
    }

    function renderBookChips() {
      const box = document.getElementById('bookChips');
      if (!box) return;
      if (state.books.length < 2) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.classList.remove('hidden');
      box.innerHTML = state.books.map(r =>
        `<button class="chip ${r.id === state.activeBookId ? 'active' : ''}" onclick="setActiveBook('${r.id}')"><span class="dot" style="background:${r.color}"></span>${escapeHtml(shortTitle(recTitle(r)))}</button>`
      ).join('');
    }

    // Ręczne odblokowanie – tylko kolejnego rozdziału (poprzedni musi być już otwarty)
    function unlockNextChapter(idx) {
      const rec = activeRec();
      if (idx > 0 && !isOpenRec(rec, idx - 1)) return;
      if (!rec.unlocked.includes(idx)) rec.unlocked.push(idx);
      saveState();
      renderReader();
      renderLibrary();
      window.scrollTo(0, 0);
    }

    function renderReader() {
      const rec = activeRec();
      const book = bookOf(rec);
      if (!book) return;
      renderBookChips();
      const box = document.getElementById('readerContent');
      const total = book.chapters.length;
      const idx = Math.min(rec.currentIndex, total - 1);
      const chap = book.chapters[idx];
      const unlockDate = unlockDateOf(rec, idx);
      const isLocked = !isOpenRec(rec, idx);
      const canUnlock = idx === 0 || isOpenRec(rec, idx - 1);
      const pct = Math.round((rec.completed.length / total) * 100);
      const left = 100 - pct;
      const chaptersLeft = total - rec.completed.length;

      let html = `
        <div style="font-size:12px;color:var(--muted);font-weight:600;">${escapeHtml(book.title)}${rec.finishedAt ? ' · ' + t(rec.finishedEarly ? 'finishedEarlyBadge' : 'finishedBadge') : ''}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="chapter-meta">
          <span>${t('chapterOf', { i: idx + 1, n: total })} · ${t('chaptersLeft', { k: chaptersLeft })}</span>
        </div>
        <div class="pct-row"><span class="pct-read">${t('pctRead', { p: pct })}</span><span class="pct-left">${t('pctLeft', { l: left })}</span></div>
      `;

      if (isLocked) {
        lockedUntilMs = unlockDate.getTime();
        const diff = Math.max(0, lockedUntilMs - nowMs());
        html += `
          <div class="lock-box">
            <div style="font-size:40px;">🔒</div>
            <h2 style="margin:8px 0 4px;">${t('lockTitle')}</h2>
            <p style="color:var(--muted);font-size:14px;">
              <strong>${escapeHtml(chap.title)}</strong><br/>
              ${t('unlockAt')} ${unlockDate.toLocaleString(loc(), { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}
            </p>
            <div class="countdown" id="countdown">${formatCountdown(diff)}</div>
            ${canUnlock ? `<button class="btn" onclick="unlockNextChapter(${idx})">${t('unlockNext')}</button>
            <p style="color:var(--muted);font-size:12px;margin:6px 0 14px;">${t('unlockHint')}</p>` : ''}
            <button class="btn btn-secondary" onclick="switchTab('calendar')">${t('seeSchedule')}</button>
          </div>
        `;
      } else {
        lockedUntilMs = null;
        const isDone = rec.completed.includes(idx);
        const paragraphs = chap.content.split(/\n+/).filter(p => p.trim()).map(p => `<p>${escapeHtml(p)}</p>`).join('');
        html += `
          <h1 class="chapter-title">${escapeHtml(chap.title)}</h1>
          <div class="reader-body">${paragraphs}</div>
          <hr style="border:none;border-top:1px solid var(--border);margin:22px 0;" />
          ${idx < total - 1
            ? `<button class="btn" onclick="completeChapter(${idx})">${isDone ? t('goNext') : t('markRead')}</button>`
            : (rec.finishedAt
                ? `<div style="text-align:center;font-weight:700;color:var(--accent);">${t('congrats')}</div>`
                : `<button class="btn" onclick="finishBook(false)">${t('finishBook')}</button>`)
          }
        `;
      }
      if (!rec.finishedAt && !(idx === total - 1 && !isLocked)) {
        html += `<button class="btn btn-secondary" style="margin-top:14px;" onclick="finishBook(true)">${t('finishEarly')}</button>
          <p style="color:var(--muted);font-size:12px;margin:6px 0 0;">${t('finishEarlyHint')}</p>`;
      }
      box.innerHTML = html;
    }

    // Odświeża tylko licznik (zamiast przebudowywać cały ekran co sekundę)
    function tickCountdown() {
      if (lockedUntilMs === null) return;
      const diff = lockedUntilMs - nowMs();
      if (diff <= 0) { renderReader(); return; }
      const el = document.getElementById('countdown');
      if (el) el.textContent = formatCountdown(diff);
    }

    // ===== Licznik przeczytanych słów i książek (dziennik – zostaje po usunięciu książki) =====
    function countWords(text) { return ((text || '').match(/\S+/g) || []).length; }
    function logRead(words, books) {
      if (!words && !books) return -1;
      const before = journey().reached;
      state.log.push({ ts: nowMs(), words: words || 0, books: books || 0 });
      const after = journey().reached;
      updateRewardIcon();
      return after > before ? after : -1;   // numer właśnie osiągniętego celu
    }

    function completeChapter(idx) {
      const rec = activeRec();
      const book = bookOf(rec);
      let reached = -1;
      if (!rec.completed.includes(idx)) {
        rec.completed.push(idx);
        reached = logRead(countWords(book.chapters[idx].content), 0);
      }
      if (idx + 1 < book.chapters.length) rec.currentIndex = idx + 1;
      saveState();
      renderReader();
      renderLibrary();
      window.scrollTo(0, 0);
      if (reached >= 0) showRewards({ title: t('rwReached', { n: bodyName(reached) }) });
    }

    // Zakończenie książki: normalnie (ostatni rozdział przeczytany) albo wcześniej – zaliczona jako przeczytana
    function finishBook(early) {
      const rec = activeRec();
      const book = bookOf(rec);
      if (!rec || !book || rec.finishedAt) return;
      if (early && !confirm(t('finishEarlyConfirm', { t: recTitle(rec) }))) return;
      const total = book.chapters.length;
      let words = 0;
      if (!early) {
        const last = total - 1;
        if (!rec.completed.includes(last)) { rec.completed.push(last); words += countWords(book.chapters[last].content); }
      }
      const reached = logRead(words, 1);
      for (let i = 0; i < total; i++) {
        if (!rec.completed.includes(i)) rec.completed.push(i);
        if (!rec.unlocked.includes(i)) rec.unlocked.push(i);
      }
      rec.finishedAt = new Date(nowMs()).toISOString();
      rec.finishedEarly = !!early;
      saveState();
      renderReader();
      renderLibrary();
      window.scrollTo(0, 0);
      showRewards({ title: reached >= 0 ? t('rwReached', { n: bodyName(reached) }) : t('rwFinished', { t: recTitle(rec) }) });
    }

    // ===== Nagrody: podsumowania + podróż przez Układ Słoneczny i dalej =====
    const WORD_M = 1000;       // jedno przeczytane słowo = 1 km podróży (wartość w metrach)
    const BOOK_WORDS = 80000;  // przeciętna powieść: ok. 80 000 słów (= 80 km)
    const LY_KM = 9.4607e12;   // jeden rok świetlny w km
    const AU_KM = 149597870.7;

    // Cele podróży w kolejności rosnącej odległości od Ziemi.
    // Planety: odległość, gdy stoją po tej samej stronie Słońca (|promień orbity − 1 AU|).
    const BODIES = [
      { id: 'moon', km: 384400, ic: '🌙' },
      { id: 'venus', km: 0.277 * AU_KM, ic: '🟡' },
      { id: 'mars', km: 0.524 * AU_KM, ic: '🔴' },
      { id: 'mercury', km: 0.613 * AU_KM, ic: '⚪' },
      { id: 'sun', km: AU_KM, ic: '☀️' },
      { id: 'jupiter', km: 4.203 * AU_KM, ic: '🟠' },
      { id: 'saturn', km: 8.537 * AU_KM, ic: '🪐' },
      { id: 'uranus', km: 18.19 * AU_KM, ic: '🔵' },
      { id: 'neptune', km: 29.07 * AU_KM, ic: '🟣' },
      { id: 'pluto', km: 38.48 * AU_KM, ic: '🟤' },
      { id: 'helio', km: 121 * AU_KM, ic: '🛰️' },          // wyjście z Układu Słonecznego (heliopauza)
      { id: 'proxima', km: 4.246 * LY_KM, ic: '⭐' },
      { id: 'center', km: 26000 * LY_KM, ic: '🌌' },
      { id: 'andromeda', km: 2.5e6 * LY_KM, ic: '🌀' },
      { id: 'virgo', km: 5.4e7 * LY_KM, ic: '✨' },
      { id: 'universe', km: 4.65e10 * LY_KM, ic: '🔭' }
    ];
    const BODY_NAMES = {
      pl: ['Księżyc', 'Wenus', 'Mars', 'Merkury', 'Słońce', 'Jowisz', 'Saturn', 'Uran', 'Neptun', 'Pluton', 'Wyjście z Układu Słonecznego', 'Proxima Centauri', 'Centrum Drogi Mlecznej', 'Galaktyka Andromedy', 'Gromada w Pannie', 'Skraj Wszechświata'],
      en: ['Moon', 'Venus', 'Mars', 'Mercury', 'Sun', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Edge of the Solar System', 'Proxima Centauri', 'Milky Way centre', 'Andromeda Galaxy', 'Virgo Cluster', 'Edge of the Universe'],
      de: ['Mond', 'Venus', 'Mars', 'Merkur', 'Sonne', 'Jupiter', 'Saturn', 'Uranus', 'Neptun', 'Pluto', 'Rand des Sonnensystems', 'Proxima Centauri', 'Zentrum der Milchstraße', 'Andromedagalaxie', 'Virgo-Haufen', 'Rand des Universums'],
      es: ['Luna', 'Venus', 'Marte', 'Mercurio', 'Sol', 'Júpiter', 'Saturno', 'Urano', 'Neptuno', 'Plutón', 'Límite del Sistema Solar', 'Próxima Centauri', 'Centro de la Vía Láctea', 'Galaxia de Andrómeda', 'Cúmulo de Virgo', 'Borde del Universo'],
      uk: ['Місяць', 'Венера', 'Марс', 'Меркурій', 'Сонце', 'Юпітер', 'Сатурн', 'Уран', 'Нептун', 'Плутон', 'Межа Сонячної системи', 'Проксима Центавра', 'Центр Чумацького Шляху', 'Галактика Андромеди', 'Скупчення Діви', 'Край Всесвіту']
    };
    function bodyName(i) { return (BODY_NAMES[state.lang] || BODY_NAMES.pl)[i]; }

    function allWords() { return state.log.reduce((a, e) => a + e.words, 0); }

    // Ile celów już osiągnięto (km podróży = słowa × 1 m)
    function journeyOf(km) {
      let reached = -1;
      BODIES.forEach((b, i) => { if (km >= b.km) reached = i; });
      const next = reached + 1 < BODIES.length ? reached + 1 : -1;
      return { km, reached, next };
    }
    function journey() { return journeyOf(allWords() * WORD_M / 1000); }

    // Ikona przycisku nagród = aktualny cel (najpierw Księżyc, potem kolejne ciała niebieskie)
    function targetIndex(j) { return j.next >= 0 ? j.next : BODIES.length - 1; }
    function updateRewardIcon() {
      const b = document.getElementById('rwBtn');
      if (b) b.textContent = BODIES[targetIndex(journey())].ic;
    }

    function periodStart(kind) {
      const d = new Date(nowMs());
      d.setHours(0, 0, 0, 0);
      if (kind === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // tydzień od poniedziałku
      else if (kind === 'month') d.setDate(1);
      else d.setMonth(0, 1);
      return d.getTime();
    }

    function statsFor(kind) {
      const from = periodStart(kind);
      let words = 0, books = 0;
      state.log.forEach(e => { if (e.ts >= from) { words += e.words; books += e.books; } });
      return { words, books };
    }

    function fmtNum(n, opts) { return n.toLocaleString(loc(), opts || { maximumFractionDigits: 0 }); }

    // Odległość w km -> czytelny tekst (m, km, mln km, mld km, lata świetlne)
    function fmtDist(km) {
      if (!(km > 0)) return '0 ' + t('uM');
      if (km < 1) return fmtNum(km * 1000) + ' ' + t('uM');
      if (km < 1e6) return fmtNum(km, { maximumFractionDigits: km < 100 ? 1 : 0 }) + ' ' + t('uKm');
      if (km < 1e9) return fmtNum(km / 1e6, { maximumFractionDigits: 1 }) + ' ' + t('uMln') + ' ' + t('uKm');
      if (km < 1e11) return fmtNum(km / 1e9, { maximumFractionDigits: 1 }) + ' ' + t('uMld') + ' ' + t('uKm');
      const ly = km / LY_KM;
      if (ly < 1000) return fmtNum(ly, { maximumSignificantDigits: 3 }) + ' ' + t('uLy');
      if (ly < 1e6) return fmtNum(ly) + ' ' + t('uLy');
      if (ly < 1e9) return fmtNum(ly / 1e6, { maximumFractionDigits: 1 }) + ' ' + t('uMln') + ' ' + t('uLy');
      return fmtNum(ly / 1e9, { maximumFractionDigits: 1 }) + ' ' + t('uMld') + ' ' + t('uLy');
    }

    function fmtPct(p) {
      if (!(p > 0)) return '0%';
      if (p >= 100) return '100%';
      if (p >= 0.001) return fmtNum(p, { maximumSignificantDigits: 2 }) + '%';
      const e = Math.floor(Math.log10(p));
      const sup = String(e).replace(/-/g, '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
      return fmtNum(p / Math.pow(10, e), { maximumFractionDigits: 1 }) + '·10' + sup + '%';
    }

    function rewardCard(kind, target) {
      const st = statsFor(kind);
      const bk = st.books * BOOK_WORDS * WORD_M / 1000, wk = st.words * WORD_M / 1000;
      const tb = BODIES[target];
      const row = (ico, label, val, km) => `
        <div class="rw-row">
          <div><div class="rw-lab">${ico} ${label}</div><div class="rw-num">${fmtNum(val)}</div></div>
          <div class="rw-dist"><strong>${fmtDist(km)}</strong><span>${tb.ic} ${escapeHtml(bodyName(target))}: ${t('pathPct', { p: fmtPct(km / tb.km * 100) })}</span></div>
        </div>`;
      return `
        <div class="rw-card">
          <div class="rw-period">${t('rw_' + kind)}</div>
          ${row('📚', t('rwBooks'), st.books, bk)}
          ${row('✍️', t('rwWords'), st.words, wk)}
        </div>`;
    }

    function journeyHtml(j) {
      if (j.next < 0) return `<div class="rw-card rw-journey"><div class="rw-period">${t('journeyTitle')}</div><div class="rw-jline">${BODIES[BODIES.length - 1].ic} ${t('jDone')}</div></div>`;
      const nb = BODIES[j.next];
      const prevKm = j.reached >= 0 ? BODIES[j.reached].km : 0;
      const frac = Math.max(0, Math.min(1, (j.km - prevKm) / (nb.km - prevKm)));
      const last = j.reached >= 0
        ? `${BODIES[j.reached].ic} ${t('jReached', { n: escapeHtml(bodyName(j.reached)) })}`
        : t('jStart');
      return `
        <div class="rw-card rw-journey">
          <div class="rw-period">${t('journeyTitle')}</div>
          <div class="rw-jline">${last}</div>
          <div class="rw-jline"><strong>${nb.ic} ${t('jNext', { n: escapeHtml(bodyName(j.next)) })}</strong></div>
          <div class="rw-jbar"><div style="width:${(frac * 100).toFixed(2)}%"></div></div>
          <div class="rw-jmeta">${t('jProg', { p: fmtPct(frac * 100), a: fmtDist(j.km), b: fmtDist(nb.km) })}</div>
        </div>`;
    }

    function milestonesHtml(j) {
      return `<div class="rw-card"><div class="rw-period">${t('milestonesTitle')}</div>` + BODIES.map((b, i) => `
        <div class="rw-ms ${i <= j.reached ? 'done' : ''}"><span>${b.ic} ${escapeHtml(bodyName(i))}</span><span>${fmtDist(b.km)} ${i <= j.reached ? '✅' : ''}</span></div>`).join('') + '</div>';
    }

    let rewardsTimer = null;

    function showRewards(opts) {
      opts = opts || {};
      const box = document.getElementById('rewards');
      if (!box) return;
      clearTimeout(rewardsTimer);
      const j = journey();
      const target = targetIndex(j);
      const empty = ['week', 'month', 'year'].every(k => { const x = statsFor(k); return !x.books && !x.words; });
      document.getElementById('rwTitle').textContent = (opts.title ? '' : BODIES[target].ic + ' ') + (opts.title || t('rwTitle'));
      document.getElementById('rwCards').innerHTML = journeyHtml(j) + ['week', 'month', 'year'].map(k => rewardCard(k, target)).join('') + milestonesHtml(j);
      document.getElementById('rwNote').textContent = empty ? t('rwEmpty') : t('rwScale', { bw: fmtNum(BOOK_WORDS), bk: fmtNum(BOOK_WORDS * WORD_M / 1000) });
      const auto = !!opts.auto;
      document.getElementById('rwBar').classList.toggle('hidden', !auto);
      document.getElementById('rwSkip').textContent = auto ? t('rwSkip') : t('rwClose');
      box.classList.remove('hidden');
      box.scrollTop = 0;
      const fill = document.getElementById('rwFill');
      fill.style.animation = 'none';
      void fill.offsetWidth;
      if (auto) {
        fill.style.animation = 'rwCountdown 4s linear forwards';
        rewardsTimer = setTimeout(closeRewards, 4000);
      }
    }

    function closeRewards() {
      clearTimeout(rewardsTimer);
      const box = document.getElementById('rewards');
      if (box) box.classList.add('hidden');
    }

    // ===== Kalendarz: rozdziały wszystkich książek (albo jednej) w kolejności terminów =====
    let calFilter = 'all';

    function setCalFilter(f) { calFilter = f; renderCalendar(); }

    function calRecs() {
      if (calFilter === 'all') return state.books;
      const r = state.books.filter(x => x.id === calFilter);
      return r.length ? r : state.books;
    }

    function renderCalendar() {
      if (!state.books.some(r => bookOf(r))) return;
      if (calFilter !== 'all' && !state.books.some(r => r.id === calFilter)) calFilter = 'all';
      const multi = state.books.length > 1;
      const filt = document.getElementById('calFilters');
      filt.classList.toggle('hidden', !multi);
      if (multi) {
        filt.innerHTML = `<button class="chip ${calFilter === 'all' ? 'active' : ''}" onclick="setCalFilter('all')">${t('calAll')}</button>` +
          state.books.map(r => `<button class="chip ${calFilter === r.id ? 'active' : ''}" onclick="setCalFilter('${r.id}')"><span class="dot" style="background:${r.color}"></span>${escapeHtml(shortTitle(recTitle(r)))}</button>`).join('');
      }
      const recs = calRecs();
      document.getElementById('calScope').textContent =
        t('calScope', { name: calFilter === 'all' ? t('calScopeAll') : recTitle(recs[0]) });

      const items = [];
      recs.forEach((rec, ri) => {
        const book = bookOf(rec);
        if (!book) return;
        book.chapters.forEach((ch, i) => items.push({ rec, ri, ch, i, d: unlockDateOf(rec, i) }));
      });
      items.sort((a, b) => (a.d - b.d) || (a.ri - b.ri) || (a.i - b.i));

      const showBook = multi && calFilter === 'all';
      document.getElementById('scheduleList').innerHTML = items.map(({ rec, ch, i, d }) => {
        const done = rec.completed.includes(i);
        const open = isOpenRec(rec, i);
        let pill = `<span class="status-pill st-lock">🔒 ${d.toLocaleDateString(loc(), { day: 'numeric', month: 'short' })}</span>`;
        if (done) pill = `<span class="status-pill st-done">${t('statusRead')}</span>`;
        else if (open) pill = `<span class="status-pill st-open">${t('statusAvail')}</span>`;
        return `
          <div class="schedule-item" onclick="openChapterIfAllowed('${rec.id}', ${i})" style="cursor:pointer;${multi ? `border-left:4px solid ${rec.color};padding-left:10px;` : ''}">
            <div>
              ${showBook ? `<div class="cal-book" style="color:${rec.color};">${escapeHtml(recTitle(rec))}</div>` : ''}
              <div style="font-weight:600;font-size:14px;">${escapeHtml(ch.title)}</div>
              <div style="font-size:12px;color:var(--muted);">${d.toLocaleString(loc(), { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}</div>
            </div>
            ${pill}
          </div>
        `;
      }).join('');
    }

    function openChapterIfAllowed(bookId, i) {

      state.activeBookId = rec.id;
      rec.currentIndex = i;

    function renderLibrary() {
